# Formatting and linting hooks. This file pins the tool versions: pre-commit installs them itself
# (PyPI wheels in its own cache), no system packages needed; except shellcheck's, which comes from the
# repository's .venv/ (version in uv.lock). Setup, once per clone:
#   pipx install pre-commit && pre-commit install && uv sync
# clang-tidy is manual (slow, needs build/compile_commands.json):
#   pre-commit run clang-tidy --hook-stage manual --all-files
exclude: ^(tests/((crplib|scm)/)?reference|potentials)/  # Fortran reference and PES data: never modified
minimum_pre_commit_version: '4.4.0'  # language: unsupported (the shellcheck hook)
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3                     # keep equal to the clang-tidy version below
    hooks:
      - id: clang-format
        types_or: [c++]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5                     # Python lint and format; settings in pyproject.toml [tool.ruff]
    hooks:
      - id: ruff-check
        args: [--fix]                # applies the safe fixes only
      - id: ruff-format
        types_or: [python, pyi]      # not the Python blocks in Markdown (ruff excludes .md too)
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.42                     # Markdown lint (reports only, fixes nothing); settings in pyproject.toml [tool.pymarkdown]
    hooks:
      - id: pymarkdown
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (from .venv; if missing, run uv sync)
        language: unsupported          # runs the repository's own shellcheck (.venv/, version in uv.lock)
        entry: .venv/bin/shellcheck
        types: [shell]                 # every shell script: by extension, or the shebang of an executable
      - id: clang-tidy
        name: clang-tidy
        language: python
        additional_dependencies: [clang-tidy==23.1.3]
        entry: tools/clang_tidy.sh
        types_or: [c++]
        files: ^(src|tests|tools)/.*\.cpp$
        stages: [manual]
