# Formatting and linting hooks. This file pins the tool versions: pre-commit installs them itself
# (PyPI wheels in its own cache), no system packages needed. Setup, once per clone:
#   pipx install pre-commit && pre-commit install
# clang-tidy is manual (slow, needs build/compile_commands.json):
#   pre-commit run clang-tidy --hook-stage manual --all-files
exclude: ^tests/reference/          # Fortran reference data: never modified
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3                     # keep equal to the clang-tidy version below
    hooks:
      - id: clang-format
        types_or: [c++]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        language: python
        additional_dependencies: [clang-tidy==23.1.3]
        entry: tools/clang_tidy.sh
        types_or: [c++]
        files: ^(src|tests|tools)/.*\.cpp$
        stages: [manual]
