# pytest settings of the plot tool's tests (ctest Plots.* and PlotRuns.*: one ctest per test module).
# Run the tool's tests in a pytest process of their own (docs/CONTRIBUTING.md, section "Testing"):
#   uv run python -I -B -m pytest -c tools/plots/pytest.ini --rootdir=tools/plots tools/plots \
#       --fixture-runs=build/tests/plot_fixtures
# pythonpath: the tool's packages (copies, readers, compute, panels) import from its directory.
[pytest]
pythonpath = .
testpaths = tests
