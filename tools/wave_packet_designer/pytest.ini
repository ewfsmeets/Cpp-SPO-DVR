# pytest settings of the designer's tests (ctest WavePacketDesigner.*: one ctest per module in tests/).
# Run one tool's tests per pytest process (README, "Tests"):
#   uv run python -I -B -m pytest -c tools/wave_packet_designer/pytest.ini \
#       --rootdir=tools/wave_packet_designer tools/wave_packet_designer
# pythonpath: the tool's own modules (program, evaluation, plots, …) import from its directory.
[pytest]
pythonpath = .
testpaths = tests
